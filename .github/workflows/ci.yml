name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly live check that the documented server and sign-in still match.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline tests
        run: npm test
      - name: Example configs are valid JSON
        run: for f in examples/*/mcp.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done

  live:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check https://daysli.com/mcp
        run: node scripts/verify.mjs
